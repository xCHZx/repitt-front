<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Tema antes del primer pintado: la misma cookie que usa Vuexy (repitt-theme: light | dark | system).
    // Sin cookie, 'light' (themeConfig.app.theme). App.vue la mantiene sincronizada después con el tema resuelto de Vuetify.
    (function () {
      var root = document.documentElement
      try {
        var match = document.cookie.match(/(?:^|;\s*)repitt-theme=([^;]*)/)
        var theme = match ? decodeURIComponent(match[1]).replace(/"/g, '') : 'light'
        if (theme !== 'light' && theme !== 'dark')
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        root.dataset.theme = theme
      }
      catch (e) {
        // Sin cookies ni matchMedia: tokens.css sigue la preferencia del sistema.
      }
    })()
  </script>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f6fe" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#25293c" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Repitt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" />
  <link rel="stylesheet" type="text/css" href="/loader.css" />

<!-- Hotjar Tracking Code for Repitt WebAPP -->
<script>
  if (window.location.hostname !== 'localhost' && window.location.hostname !== 'app-stg.repitt.com') {
    (function (h, o, t, j, a, r) {
      h.hj = h.hj || function () {
        // eslint-disable-next-line prefer-rest-params
        (h.hj.q = h.hj.q || []).push(arguments)
      }
      h._hjSettings = { hjid: 5019020, hjsv: 6 }
      a = o.getElementsByTagName('head')[0]
      r = o.createElement('script')
      r.async = 1
      r.src = t + h._hjSettings.hjid + j + h._hjSettings.hjsv
      a.appendChild(r)
    })(window, document, 'https://static.hotjar.com/c/hotjar-', '.js?sv=')
}
</script>

</head>

<body>
  <div id="app">
    <div id="loading-bg">
      <div class="loading-logo">
        <img src="./src/assets/images/logo-v2.png" width="86" alt="Repitt" />
      </div>
      <div class=" loading">
        <div class="effect-1 effects"></div>
        <div class="effect-2 effects"></div>
        <div class="effect-3 effects"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Color del cargador inicial: lo guarda initCore (src/@core/initCore.ts) con esta clave.
    // El fondo no se lee de ahí (initCore guarda --superficie, #fff): loader.css usa --fondo según
    // html[data-theme], que ya fijó el script del <head>, y así no hay destello blanco → lavanda.
    try {
      var loaderColor = localStorage.getItem('repitt-initial-loader-color')

      if (loaderColor)
        document.documentElement.style.setProperty('--initial-loader-color', loaderColor)
    }
    catch (e) {
      // Sin almacenamiento: loader.css usa sus colores por defecto.
    }
  </script>
  </body>
</html>
